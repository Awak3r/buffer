name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      upload-release-assets:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  relay:
    name: Go relay (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Test clipboard exchange in both directions
        run: go test -race ./...
      - name: Build Linux amd64 and arm64 binaries
        shell: bash
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/buffer-relay-linux-amd64 ./cmd/relay
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o dist/buffer-relay-linux-arm64 ./cmd/relay
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: inputs.upload-release-assets
        with:
          name: unsigned-release-relay
          if-no-files-found: error
          path: dist/buffer-relay-linux-*

  desktop:
    name: Go client (Windows)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Test Windows pairing and reconnect
        run: go test ./cmd/desktop
      - name: Build Windows amd64 tray executable
        env:
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags=-H=windowsgui -o dist/buffer.exe ./cmd/desktop
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: inputs.upload-release-assets
        with:
          name: unsigned-release-desktop
          if-no-files-found: error
          path: dist/buffer.exe

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          gradle-version: '8.9'
      - name: Build unsigned APK and run Android lint
        working-directory: android
        shell: bash
        run: |
          sdkmanager 'platforms;android-35'
          gradle --no-daemon :app:assembleRelease :app:lintRelease
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: inputs.upload-release-assets
        with:
          name: unsigned-release-android
          if-no-files-found: error
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
